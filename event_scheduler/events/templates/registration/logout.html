{% extends 'base.html' %}
{% block title %}Logged Out{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card text-center">
            <div class="card-body p-5">
                <i class="bi bi-box-arrow-right display-1 text-muted mb-3 d-block"></i>
                <h3 class="mb-2">You've been logged out</h3>
                <p class="text-muted mb-4">Thanks for using Event Scheduler. See you next time!</p>
                <div class="d-flex justify-content-center gap-3">
                    <a href="{% url 'login' %}" class="btn btn-primary">
                        <i class="bi bi-box-arrow-in-right"></i> Login Again
                    </a>
                    <a href="{% url 'register' %}" class="btn btn-outline-secondary">
                        <i class="bi bi-person-plus"></i> Register
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% extends 'base.html' %}
{% block title %}Delete Event{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-danger">
            <div class="card-header bg-danger text-white">
                <h5 class="mb-0"><i class="bi bi-exclamation-triangle"></i> Confirm Delete</h5>
            </div>
            <div class="card-body text-center py-4">
                <i class="bi bi-trash display-3 text-danger mb-3 d-block"></i>
                <h5>Are you sure you want to delete this event?</h5>
                <p class="text-muted"><strong>{{ event.name }}</strong> on {{ event.date }} at {{ event.time }}</p>
                <p class="text-muted small">This action cannot be undone.</p>
            </div>
            <div class="card-footer bg-transparent d-flex justify-content-center gap-3">
                <form method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">
                        <i class="bi bi-trash"></i> Yes, Delete
                    </button>
                </form>
                <a href="{% url 'event_list' %}" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
